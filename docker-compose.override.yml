# Override automaticamente aplicado por `docker compose up`.
# Tuning para rodar o stack em máquinas com 4 GB RAM.
# Em servidor de 8+ GB basta renomear/remover este arquivo.

services:
  kestra:
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=60"
    mem_limit: 1024m
    mem_reservation: 512m

  postgres:
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c work_mem=4MB
    mem_limit: 384m

  minio:
    mem_limit: 256m

  agent-core:
    mem_limit: 512m
    environment:
      SANDBOX_MEMORY_LIMIT: "1g"
      SANDBOX_CPU_LIMIT: "1.5"

  nginx:
    mem_limit: 64m
