services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cortex]

  minio:
    image: minio/minio:latest
    container_name: cortex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cortex]

  kestra:
    image: kestra/kestra:latest
    container_name: cortex-kestra
    restart: unless-stopped
    user: "root"
    command: server standalone
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${PG_DB}
            driverClassName: org.postgresql.Driver
            username: ${PG_USER}
            password: ${PG_PASSWORD}
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cortex]

  agent-core:
    build:
      context: ./agent-core
      dockerfile: Dockerfile
    container_name: cortex-agent-core
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_tmp:/tmp/sandbox
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [cortex]

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: ${SANDBOX_IMAGE:-ds-agents-sandbox:latest}
    profiles: ["tools"]
    # Imagem construída para ser spawnada on-demand pelo agent-core.
    # Não sobe junto com o stack.

  nginx:
    image: nginx:1.27-alpine
    container_name: cortex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-core
      - kestra
    networks: [cortex]

volumes:
  postgres_data:
  minio_data:
  kestra_data:
  sandbox_tmp:
    name: cortex_sandbox_tmp

networks:
  cortex:
    driver: bridge
